name: Feature request
description: Something new, such as an endpoint, field or client option
labels: [enhancement]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature
      description: What should the library support? Link the BGG XML API2 wiki section if it is an endpoint or field
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What would you use it for?
    validations:
      required: true
